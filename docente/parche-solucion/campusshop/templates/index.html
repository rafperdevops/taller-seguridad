{% extends "base.html" %}
{% block titulo %}Inicio{% endblock %}
{% block contenido %}
<h1>Todo para tu semestre</h1>
<div class="grilla">
  {% for p in productos %}
  <a class="tarjeta" href="/productos/{{ p.id }}">
    <h3>{{ p.nombre }}</h3>
    <p>{{ p.descripcion }}</p>
    <strong>${{ '%.2f' % p.precio }}</strong>
  </a>
  {% endfor %}
</div>
{% endblock %}
